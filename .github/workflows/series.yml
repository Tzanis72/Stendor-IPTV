name: Σειρές
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalog
jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py series
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalog
          git diff --cached --quiet || git commit -m "Σειρές: ενημέρωση καταλόγου"
          git pull --rebase
          git push
