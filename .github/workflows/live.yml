name: Live κανάλια
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalog
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py live
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add live.m3u
          git diff --cached --quiet || git commit -m "Live: ενημέρωση λίστας"
          git pull --rebase
          git push
